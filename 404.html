  :root {

  .oxbar {

    bottom: 12px; bottom: max(12px, env(safe-area-inset-bottom));
    padding: 0 12px;

  .oxbar.is-shown { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; }
  .oxbar__card {

  @media (prefers-reduced-motion: reduce) {

  <script>
  (function () {

    var bar = document.getElementById("oxbar");

    var ua = navigator.userAgent || "";

      : "other";
    if (platform === "other") return; // desktop: never rendered

    var ios = platform === "ios";
    var cta = bar.querySelector(".oxbar__cta");
    cta.href = ios ? "https://apps.apple.com/us/app/oxynx-health/id6758890598" : "https://play.google.com/store/apps/details?id=com.oxynx.oxynx";

    var otherStore = bar.querySelector('[data-store]:not([data-store="' + platform + '"])');
    if (otherStore) otherStore.parentNode.removeChild(otherStore);
    cta.addEventListener("click", function () {
      if (typeof window.gtag === "function") window.gtag("event", "download_click", { platform: platform, placement: "mobile_bar" });
    });
    bar.hidden = false;

    var TOP = 160;          // "past the top area" on these pages (no hero store buttons)
    var shown = false, nearFooter = false, anchorY = window.scrollY, dir = 1, idle;
    var roomToScroll = function () { return document.documentElement.scrollHeight - window.innerHeight > TOP + 40; };
    var pastTop = function () { return window.scrollY > TOP || !roomToScroll(); };
    var render = function () {
      var visible = shown && !nearFooter;
      bar.classList.toggle("is-shown", visible);
      if (visible) bar.removeAttribute("aria-hidden"); else bar.setAttribute("aria-hidden", "true");
      cta.tabIndex = visible ? 0 : -1;
      if ("inert" in bar) bar.inert = !visible;

    var set = function (v) { if (v !== shown) { shown = v; render(); } };
    // Reading pause: bring it back once the page has been still for a moment.
    var rest = function () {
      clearTimeout(idle);
      idle = setTimeout(function () { if (pastTop()) set(true); }, 1200);
    };
    window.addEventListener("scroll", function () {
      var y = window.scrollY;
      clearTimeout(idle);
      if (!pastTop()) { set(false); anchorY = y; return; }
      // Measure from where the current scroll direction started, so slow scrolls count too.
      var d = y >= anchorY ? 1 : -1;
      if (d !== dir) { dir = d; anchorY = y; }
      if (anchorY - y > 24) { set(true); anchorY = y; }        // scrolling up: show

    var footer = document.querySelector("footer");
    if (footer && "IntersectionObserver" in window) {
      new IntersectionObserver(function (entries) {
        nearFooter = entries[0].isIntersecting;
        render();
      }).observe(footer);
    }
    render();
    // Already past the top (restored scroll), or a short page with nothing to scroll past (e.g. 404).
    if (pastTop()) rest();
  })();
