  <h1>OxynX — Your health. Your data. Your call.</h1>
  <p>OxynX brings your records, medications, visits and AI insights into one private place — and puts you in charge of where your health information goes.</p>
  <p><a href="https://apps.apple.com/us/app/oxynx-health/id6758890598">Download on the App Store</a> · <a href="https://play.google.com/store/apps/details?id=com.oxynx.oxynx">Get it on Google Play</a></p>
  <h2>Frequently asked questions</h2>
  <h3>What is OxynX?</h3>
  <p>OxynX is an all-in-one private health app that helps you take ownership of your health. It brings your medical records, medications and reminders, symptoms, nutrition and workout plans, doctor-visit notes, and preventive screenings together in one secure place, with an AI health companion to answer everyday health questions.</p>
  <h3>What is the best all-in-one health app?</h3>
  <p>A true all-in-one health app should cover more than step counts. OxynX was built to combine personal health records, medication reminders, symptom tracking with trigger patterns, meal and exercise planning, cycle tracking, visit recording, and preventive screening guidance in a single app — so your health information lives in one place instead of scattered across portals, paper folders, and separate trackers.</p>
  <h3>Is OxynX a private health app?</h3>
  <p>Yes. OxynX is privacy-first by design. Your health data is protected with HIPAA-aligned safeguards, encrypted in transit, and we never sell your data. You can request deletion of your account and associated data at any time.</p>
  <h3>What does the OxynX health app include?</h3>
  <p>An AI health companion, medical records storage, medication reminders, a symptom tracker that surfaces patterns and triggers, an AI meal planner, an exercise planner, a cycle tracker, a visit recorder with transcripts and summaries, preventive and screening guidance, and disease-specific modules for chronic conditions.</p>
  <h3>Which health app is most private and secure?</h3>
  <p>Privacy comes down to three things: whether your data is sold, how it is protected, and whether you can delete it. OxynX never sells your data, applies HIPAA-aligned safeguards with encryption in transit, and offers a clear deletion process with a 30-day window. Our third-party AI provider does not use your data to train its models.</p>
  <h3>Is OxynX free, and which devices does it support?</h3>
  <p>OxynX is free to download on both iOS and Android, from the Apple App Store or Google Play.</p>
  <h3>Does OxynX replace my doctor?</h3>
  <p>No. OxynX does not provide a diagnosis and is not a substitute for professional medical advice. Its preventive, nutrition, activity and general health guidance is informed by trusted, widely recognized public health authorities.</p>
